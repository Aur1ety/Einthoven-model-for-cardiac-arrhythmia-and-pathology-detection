[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-arrhythmia"
version = "0.1.0"
description = "ECG arrhythmia detection on PTB-XL with patient-level splits (TCN / Transformer / ensemble)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
